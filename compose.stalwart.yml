services:
  stalwart:
    container_name: hanasand_mail
    image: hanasand_stalwart
    build:
      context: ./stalwart
      dockerfile: Dockerfile
    command: ["--config", "/opt/stalwart/etc/config.json"]
    mem_limit: 1g
    cpus: "2.0"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ${HANASAND_STALWART_STATE_DIR:-/home/hanasand/hanasand/mail/stalwart}:/opt/stalwart
    ports:
      - "127.0.0.1:${MAIL_HTTP_LOCAL_PORT:-8081}:8080"
      - "127.0.0.1:${MAIL_SMTP_LOCAL_PORT:-2525}:25"
      - "127.0.0.1:${MAIL_SMTPS_LOCAL_PORT:-2465}:465"
      - "127.0.0.1:${MAIL_SUBMISSION_LOCAL_PORT:-2587}:587"
      - "127.0.0.1:${MAIL_IMAP_LOCAL_PORT:-2143}:143"
      - "127.0.0.1:${MAIL_IMAPS_LOCAL_PORT:-2993}:993"
      - "127.0.0.1:${MAIL_MANAGESIEVE_LOCAL_PORT:-4191}:4190"
    networks:
      hanasandnet:
        aliases: [stalwart]

  relay-ovh-stalwart:
    container_name: hanasand-mail-relay-ovh
    image: ${HANASAND_MAIL_RELAY_STALWART_IMAGE:-stalwartlabs/stalwart@sha256:b6c2a04a79695136d5e2c16e9da0254135d0c3f3b1f8147873e812916b0ae8c4}
    profiles: [relay-ovh]
    user: "1000:1000"
    mem_limit: 512m
    cpus: "1.0"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - ${HANASAND_MAIL_RELAY_ROOT:-/home/hanasand/hanasand/mail/mail-relay}/data:/opt/stalwart
      - ${HANASAND_MAIL_RELAY_ROOT:-/home/hanasand/hanasand/mail/mail-relay}/tls:/run/tls:ro
    ports:
      - "127.0.0.1:2687:1587"
      - "127.0.0.1:18081:8080"
    networks:
      mail-relay:
        aliases: [smtp-relay.hanasand.com]

  relay-health-ovh:
    container_name: hanasand-mail-relay-ovh-health
    image: ${HANASAND_MAIL_RELAY_HEALTH_IMAGE:-hanasand-mail-relay-health:latest}
    build:
      context: ./mail-relay
      dockerfile: Dockerfile
    profiles: [relay-ovh]
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 512m
    cpus: "1.0"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - ${HANASAND_MAIL_RELAY_ROOT:-/home/hanasand/hanasand/mail/mail-relay}/health:/run/config:ro
    ports:
      - "127.0.0.1:19262:8080"
    networks: [mail-relay]

  relay-health-inspur:
    container_name: hanasand-mail-relay-inspur
    image: ${HANASAND_MAIL_RELAY_HEALTH_IMAGE:-hanasand-mail-relay-health:latest}
    build:
      context: ./mail-relay
      dockerfile: Dockerfile
    profiles: [relay-inspur]
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 512m
    cpus: "1.0"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - ${HANASAND_MAIL_RELAY_ROOT:-/home/hanasand/hanasand/mail/mail-relay}/health:/run/config:ro
      - ${HANASAND_MAIL_RELAY_ROOT:-/home/hanasand/hanasand/mail/mail-relay}/ssh:/run/ssh:ro
    ports:
      - "127.0.0.1:19261:8080"
    networks:
      hanasandnet:
        aliases: [mail-relay-inspur, smtp-relay.hanasand.com]
        ipv4_address: ${HANASAND_MAIL_RELAY_INSPUR_IP:-172.20.0.9}

  mail-gateway-ovh:
    container_name: hanasand-mail-gateway-ovh
    image: haproxy@sha256:6343ce34a132a5dceaa24767d739df2bd519f8f7c1079ae39e4821334e8eb42e
    profiles: [relay-ovh]
    restart: unless-stopped
    network_mode: host
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    read_only: true
    mem_limit: 128m
    cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - ${HANASAND_MAIL_RELAY_ROOT:-/home/hanasand/hanasand/mail/mail-relay}/gateway.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

networks:
  hanasandnet:
    external: true
    name: ${HANASAND_SHARED_NETWORK:-hanasand_hanasandnet}
  mail-relay:
    external: true
    name: ${HANASAND_MAIL_RELAY_NETWORK:-hanasand-mail-relay}
