global
    log stdout format raw local0
    maxconn 256
    user haproxy
    group haproxy

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 10s
    timeout client 5m
    timeout server 5m

frontend incoming_mail
    bind 192.99.32.185:25
    default_backend inspur_mailboxes

backend inspur_mailboxes
    # The SSH listener is loopback-only. Preserve the real SMTP client for SPF,
    # spam checks and rate limits; never accept client-supplied PROXY headers.
    server mail 127.0.0.1:2625 send-proxy-v2
